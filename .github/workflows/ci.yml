name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/validate-desktop-release.mjs
      - run: node --test scripts/desktop-release.node-test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows:
    name: Windows native quality
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: windows-2022-rust-1.100.0-quality-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.ref }}
      - run: npm ci
      - run: node scripts/validate-desktop-release.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Compile Windows Tauri application
        run: npm run desktop:build -- --debug --no-bundle --ci --target x86_64-pc-windows-msvc -- --locked
