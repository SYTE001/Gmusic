[package]
name = "gmusic"
version = "1.1.0"
description = "Gmusic offline-first personal music player desktop app"
authors = ["SYTE"]
edition = "2021"

[lib]
name = "gmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
