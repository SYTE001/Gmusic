[package]
name = "gmusic"
version = "1.1.0"
description = "Gmusic offline-first personal music player desktop app"
authors = ["SYTE"]
edition = "2021"

[lib]
name = "gmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "fs"] }
futures-util = "0.3"
sha2 = "0.10"
tempfile = "3"
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "test-util"] }
