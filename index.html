<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Gmusic — an offline personal music player. Your files stay on your device." />
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Gmusic</title>
    <script>
      // Apply the persisted theme before first paint so the app never flashes
      // the wrong theme while IndexedDB loads (settingsStore owns the value;
      // this mirror only removes the startup gap).
      (function () {
        try {
          var theme = localStorage.getItem("lm-theme");
          var resolved =
            theme === "light" || theme === "dark"
              ? theme
              : theme === "system"
                ? window.matchMedia("(prefers-color-scheme: light)").matches
                  ? "light"
                  : "dark"
                : "dark";
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", resolved === "dark" ? "#09090b" : "#f5f5f7");
          var motion = localStorage.getItem("lm-motion");
          if (motion === "on" || motion === "off") document.documentElement.dataset.motion = motion;
        } catch (e) {
          /* Storage unavailable: :root defaults to the dark tokens. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
